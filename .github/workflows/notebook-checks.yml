name: Notebook static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook validator
        run: python -m pip install 'nbformat>=5.9,<6'
      - name: Run unit and structural tests
        run: python -m unittest discover -s tests -v
      - name: Validate notebook format
        run: |
          python -c "import nbformat; p='notebooks/vegetable_cnn_classification.ipynb'; nb=nbformat.read(p, as_version=4); nbformat.validate(nb); print('Notebook format valid')"
